services:
  # ──────────────────────────────────────────────────────────
  # PostgreSQL 16 with PostGIS
  # ──────────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-labshare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-labshare_dev}
      POSTGRES_DB: ${POSTGRES_DB:-labshare}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-labshare} -d ${POSTGRES_DB:-labshare}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────────────────
  # Redis 7
  # ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ──────────────────────────────────────────────────────────
  # MinIO (S3-compatible local storage)
  # ──────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-labshare_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-labshare_minio_secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────────────────
  # API (NestJS)
  # ──────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-labshare}:${POSTGRES_PASSWORD:-labshare_dev}@postgres:5432/${POSTGRES_DB:-labshare}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_prod_32chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_change_in_prod_32}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-labshare_minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-labshare_minio_secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-labshare}
      OTP_PROVIDER: mock
      DEMO_MODE: ${DEMO_MODE:-false}
      PORT: 3001
    ports:
      - "${API_PORT:-3001}:3001"
    volumes:
      - ./apps/api:/app/apps/api:delegated
      - ./packages:/app/packages:delegated
      - api_node_modules:/app/node_modules
      - api_app_node_modules:/app/apps/api/node_modules
    command: pnpm --filter @labshare/api dev

  # ──────────────────────────────────────────────────────────
  # Web (Next.js)
  # ──────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-3001}/api/v1
      NEXT_PUBLIC_WS_URL: http://localhost:${API_PORT:-3001}
      NEXT_PUBLIC_MAP_STYLE: https://tiles.stadiamaps.com/styles/alidade_smooth.json
      NEXT_PUBLIC_DEMO_MODE: ${DEMO_MODE:-false}
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web:/app/apps/web:delegated
      - ./packages:/app/packages:delegated
      - web_node_modules:/app/node_modules
      - web_app_node_modules:/app/apps/web/node_modules

volumes:
  postgres_data:
  redis_data:
  minio_data:
  api_node_modules:
  api_app_node_modules:
  web_node_modules:
  web_app_node_modules:
